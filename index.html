<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Galore</title>
  <style>

     body {
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      min-height: 100vh;
      font-family: sans-serif;
      margin: 0;
     }

    .container {
      display: flex;
      gap: 10px;
      align-items: center;
      background-color: #e3edff;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 470px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 12px;
    }
    
    input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      outline: none;
      color: #1f2927;
      padding-right: 30px;
      padding-left: 5px;
      padding-bottom:0;
    }

    input::placeholder {
      color: #9ca3af;
      font-style: italic;
    }

    input:focus {
      border-bottom: 2px solid#3b82f6;
    }

    .search {
      background-color: #3b82f6;
      color: white;
      border: none;

      border-radius: 999px;
      padding: 10px 22px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .search:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .search:active {
      transform: scale(0.96);
    }


    #displayMovie {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 0 20px;
    }
    .newDiv{
      background: rgba(255, 255, 255,0.08);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(8px);
      transition: 0.35s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;

      box-shadow: 
      0 0 12px rgba(59,130,246,0.15), 
      0 0 30px rgba(59, 130, 246, 0.08);
      
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity: 0;
        transform: translateY(-20px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    .newDiv:hover{
      transform: translateY(-8px);

      box-shadow: 
       0 0 18px rgba(96, 165, 250, 0.35),
       0 0 45px rgba(59, 130, 246, 0.22);
    }

    p{
      color: white;
      margin: 6px 0;
      text-align: center;
    }

    .movieTitle{
      font-size: 1.1rem;
      font-weight: bold;
    }

    img{
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 14px;
      transition: 0.3s ease;
    }

    img:hover{
      transform: scale(1.03);
    }

    .errorContainer{
      display: flex;
      min-height: 60vh;
      justify-content: center;
      align-items: center;
    }

    .errorText{
      font-size: 7rem;
      color: #cbd5e1;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
      font-style: italic;
      font-weight: 600;
      animation: fadeText 2s ease;
    }

    @keyframes fadeText{
      from{
        opacity: 0;
      }

      to{
        opacity: 0.7;
      }
    }


header{
  background: linear-gradient(to right, #000814, #001d3d, #003566, #001d3d, #000814);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 4px 30px rgba(0,0,0,0.45);
  padding: 20px 48px 28px;
}
    
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.navbar h1{
  color: white;
  margin: 0;
  font-size: 33px;
}

.navLinks{
  display: flex;
  gap: 42px;
}
.navbar a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  transition: 0.3s;
}

.navbar a:hover{
  color: white;
  text-shadow: 
  0 0 8px rgba(255,255,255,0.7), 
  0 0 20px rgba(59,130,246,0.8);

  transform: translateY(-2px);
}

.navbar a::after{
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 0%;
  height: 2px;
  background: #60a5fa;
  transition: 0.3s;
}

.navbar a:hover::after{
  width: 100%;
}


@media (max-width: 768px){
  .navbar{
    padding: 16px 20px;
  }

  .navLinks{
    gap: 18px;
  }

  .container{
    max-width: 400px;
  }

  #displayMovie{
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }

  .errorText{
    font-size: 4rem;
  }
}

@media (max-width: 480px){
  .navbar{
    flex-direction: column;
    gap: 12px;
  }

  .navLinks{
    gap: 14px;
  }

  .container{
    flex-direction: column;
    max-width: 300px;
    padding: 14px;
  }

  input{
    width: 100%;
  }

  #displayMovie{
    grid-template-columns: 1fr;
  }

  .errorText{
    font-size: 2.2rem;
    text-align: center;
  }
}
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <h1>Movies Galore</h1>
      <div class="container">
  <input type="text" placeholder="movie..." maxlength="100">
  <button class="search">Search</button>
  </div>
      <div class="navLinks">
        
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">More</a>
      </div>
    </nav>
  </header>
  <div>

  <!-- <div class="container">
  <input type="text" placeholder="movie..." maxlength="100">
  <button class="search">Search</button>
  </div> -->

  <div id="displayMovie"></div>
  </div>


  <script>
    const input = document.querySelector("input");
    const search = document.querySelector(".search");
    const displayMovie = document.querySelector("#displayMovie");

    const API_KEY = 'bfabd8f0e8dea4256f4c422c45990456';

    
    search.addEventListener("click", ()=>{
      getMovie();
    });

    async function getMovie (){
      displayMovie.innerHTML = "";

      const movieName = input.value;
      const response = await fetch( `https://api.themoviedb.org/3/search/movie?query=${movieName}&api_key=${API_KEY}`);
      const data = await response.json();

      if(data.results.length === 0){
        displayError();
        return;
      }

      console.log(data);

      input.value = "";

      renderMovies(data.results);
  }
     
       function renderMovies(results){
        results.forEach(movie =>{

        if(!movie.poster_path) return;

        const newDiv = document.createElement("div");
        newDiv.className = "newDiv";

        const img = document.createElement("img");
        img.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;

        const pTag = document.createElement("p");
        pTag.textContent = movie.title;
        pTag.className = "movieTitle";

        const rateP = document.createElement("p");
        rateP.textContent = `⭐${movie.vote_average.toFixed(1)}`;
        rateP.className = "rating";

        const yearP = document.createElement("p");
        yearP.textContent = movie.release_date? movie.release_date.slice(0,4) : "N/A";
        yearP.className = "year";

        newDiv.appendChild(img);
        newDiv.appendChild(pTag);
        newDiv.appendChild(rateP);
        newDiv.appendChild(yearP);

        newDiv.addEventListener("click",()=>{
          window.open(`https://www.themoviedb.org/movie/${movie.id}`, "_blank");
        
        });
        
        displayMovie.appendChild(newDiv);
      });
       }


    function displayError(){
        const errorDiv = document.createElement("div");
        errorDiv.className = "errorContainer";

        const errorP = document.createElement("p");
        errorP.textContent ="Movie not found! 🤦‍♂️ ";
        errorP.className = "errorText";

        errorDiv.appendChild(errorP);
        document.body.append(errorDiv);
    }



    async function getTrendingMovies(){
      const response = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=bfabd8f0e8dea4256f4c422c45990456`);
      const data = await response.json();

      renderMovies(data.results);
    }

    input.addEventListener("keydown", (event)=>{
      if(event.key==="Enter"){
        search.click();
      }
    });

    getTrendingMovies();

  </script>
</body>
</html>
