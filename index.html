<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Galore</title>
  <style>

    .container {
      display: flex;
      gap: 10px;
      align-items: center;
      background-color: #f3f4f6;
      border-radius: 30px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
    }
    input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      padding: 8px 5px;
      outline: none;
      color: #1f2927;
    }

    input::placeholder {
      color: #9ca3af;
      font-style: italic;
    }

    input:focus {
      border-bottom: 2px solid#3b82f6;
    }

    .search {
      background-color: #3b82f6;
      color: white;
      border: none;

      border-radius: 22px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .search:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .search:active {
      transform: scale(0.96);
    }


    #displayMovie {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 0 20px;
    }
  </style>
</head>
<body>
    <h1>Movies Galore</h1>
  <div>

  <div class="container">
  <input type="text" placeholder="movie..." maxlength="100">
  <button class="search">Search</button>
  </div>

  <div id="displayMovie"></div>
  </div>


  <script src="script.js">
    const input = document.querySelector("input");
    const search = document.querySelector(".search");
    const displayMovie = document.querySelector("#displayMovie");

    // const API_KEY = 'bfabd8f0e8dea4256f4c422c45990456';
  </script>
</body>
</html>
