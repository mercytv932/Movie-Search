<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Galore</title>
  <style>

     body {
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      min-height: 100vh;
      font-family: sans-serif;
      margin: 0;
     }

     h1 {
      color: white;
      margin: 30px;
     }

    .container {
      display: flex;
      gap: 10px;
      align-items: center;
      background-color: #f3f4f6;
      border-radius: 30px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 10px auto;
      padding: 10px 15px;

      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      padding: 8px 5px;
      outline: none;
      color: #1f2927;
    }

    input::placeholder {
      color: #9ca3af;
      font-style: italic;
    }

    input:focus {
      border-bottom: 2px solid#3b82f6;
    }

    .search {
      background-color: #3b82f6;
      color: white;
      border: none;

      border-radius: 22px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .search:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .search:active {
      transform: scale(0.96);
    }


    #displayMovie {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      padding: 0 20px;
    }
    .newDiv{
      background: rgba(255, 255, 255,0.08);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(8px);
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity: 0;
        transform: translateY(-20px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    .newDiv:hover{
      transform: translateY(-8px);
    }

    p{
      color: white;
      margin: 6px 0;
      text-align: center;
    }

    .movieTitle{
      font-size: 1.1rem;
      font-weight: bold;
    }

    img{
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 14px;
      transition: 0.3s ease;
    }

    img:hover{
      transform: scale(1.03);
    }

    .errorContainer{
      display: flex;
      min-height: 60vh;
      justify-content: center;
      align-items: center;
    }

    .errorText{
      font-size: 7rem;
      color: #cbd5e1;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
      font-style: italic;
      font-weight: 600;
      animation: fadeText 2s ease;
    }

    @keyframes fadeText{
      from{
        opacity: 0;
      }

      to{
        opacity: 0.7;
      }
    }


header{
  background-color: #002f93;
  padding: 20px 20px;
}
    
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.navbar h1{
  color: white;
  margin: 0;
}

.navLinks{
  display: flex;
  gap: 35px;
}
.navbar a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}




  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <h1>Movies Galore</h1>
      <div class="navLinks">
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">More</a>
      </div>
    </nav>
  </header>
  <div>

  <div class="container">
  <input type="text" placeholder="movie..." maxlength="100">
  <button class="search">Search</button>
  </div>

  <div id="displayMovie"></div>
  </div>


  <script>
    const input = document.querySelector("input");
    const search = document.querySelector(".search");
    const displayMovie = document.querySelector("#displayMovie");

    const API_KEY = 'bfabd8f0e8dea4256f4c422c45990456';

    search.addEventListener("click", ()=>{
      getMovie();
    });

    async function getMovie (){
      displayMovie.innerHTML = "";

      const movieName = input.value;
      const response = await fetch( `https://api.themoviedb.org/3/search/movie?query=${movieName}&api_key=${API_KEY}`);
      const data = await response.json();

      if(data.results.length === 0){
        displayError();
      }
      

      data.results.forEach(movie =>{

        if(!movie.poster_path) return;

        const newDiv = document.createElement("div");
        newDiv.className = "newDiv";

        const img = document.createElement("img");
        img.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;

        const pTag = document.createElement("p");
        pTag.textContent = movie.title;
        pTag.className = "movieTitle";

        const rateP = document.createElement("p");
        rateP.textContent = `⭐${movie.vote_average.toFixed(1)}`;
        rateP.className = "rating";

        const yearP = document.createElement("p");
        yearP.textContent = movie.release_date? movie.release_date.slice(0,4) : "N/A";
        yearP.className = "year";

        newDiv.appendChild(img);
        newDiv.appendChild(pTag);
        newDiv.appendChild(rateP);
        newDiv.appendChild(yearP);

        newDiv.addEventListener("click",()=>{
          window.open(`https://www.themoviedb.org/movie/${movie.id}`, "_blank");
        
        });
        
        displayMovie.appendChild(newDiv);
      });

      console.log(data);

      input.value = "";
  }

    function displayError(){

        const errorDiv = document.createElement("div");
        errorDiv.className = "errorContainer";

        const errorP = document.createElement("p");
        errorP.textContent ="Movie not found! 🤦‍♂️ ";
        errorP.className = "errorText";

        errorDiv.appendChild(errorP);
        document.body.append(errorDiv);
    }

    input.addEventListener("keydown", (event)=>{
      if(event.key==="Enter"){
        search.click();
      }
    });

  </script>
</body>
</html>
