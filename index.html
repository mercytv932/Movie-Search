<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Galore</title>
  <style>

     body {
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      min-height: 100vh;
      font-family: sans-serif;
      margin: 0;
     }

     h1 {
      color: white;
      margin: 30px;
     }

    .container {
      display: flex;
      gap: 10px;
      align-items: center;
      background-color: #f3f4f6;
      border-radius: 30px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 10px auto;
      padding: 20px;
    }
    
    input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      padding: 8px 5px;
      outline: none;
      color: #1f2927;
    }

    input::placeholder {
      color: #9ca3af;
      font-style: italic;
    }

    input:focus {
      border-bottom: 2px solid#3b82f6;
    }

    .search {
      background-color: #3b82f6;
      color: white;
      border: none;

      border-radius: 22px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .search:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .search:active {
      transform: scale(0.96);
    }


    #displayMovie {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 0 20px;
    }
  </style>
</head>
<body>
    <h1>Movies Galore</h1>
  <div>

  <div class="container">
  <input type="text" placeholder="movie..." maxlength="100">
  <button class="search">Search</button>
  </div>

  <div id="displayMovie"></div>
  </div>


  <script>
    const input = document.querySelector("input");
    const search = document.querySelector(".search");
    const displayMovie = document.querySelector("#displayMovie");

    const API_KEY = 'bfabd8f0e8dea4256f4c422c45990456';

    search.addEventListener("click", ()=>{
      getMovie();
    })

    async function getMovie (){
      const movieName = input.value;
      const response = await fetch( `https://api.themoviedb.org/3/search/movie?query=${movieName}&api_key=${API_KEY}`);
      const data = await response.json();

      data.results.forEach(movie =>{
        const newDiv = document.createElement("div");
        newDiv.className = "newDiv";

        const img = document.createElement("img");
        img.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;

        const pTag = document.createElement("p");
        pTag.textContent = movie.title;

        newDiv.appendChild(img);
        newDiv.appendChild(pTag);

        displayMovie.appendChild(newDiv);
      });

      console.log(data);
    }

  </script>
</body>
</html>
